services:

  agent_bot:
    build: .
    env_file:
      - .env
    volumes:
      - .:/app
    environment:
      - POSTGRES_HOST=agent_db
    depends_on:
      agent_db:
        condition: service_healthy

    command: >
      bash -c "until alembic upgrade head; do echo 'DB is unavailable, retrying in 3s...'; sleep 3; done; exec python -m bot.main"
    restart: always
    ports:
      - "5000:5000"

  agent_db:
    image: postgres:17
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  postgres_data: